# Monstro UI Library - Source Module

targets:
  shared_libraries:
    - name: libmonstro
      # The library is libmonstro on every platform (libmonstro.so, .dylib, .dll): Windows file
      # names ignore case, and monstro.dll would be the C# binding's own Monstro.dll.
      output_prefix: ""
      language: cpp
      sources:
        - "*.cpp"
        - "widgets/*.cpp"
      include_dirs:
        - "../include"
        - "../externals"
      defines:
        - "MONSTRO_EXPORT=1"
      # A program linked against the library records this name, not the path it was linked from,
      # so the library loads from wherever the program ships it: beside it, or on its rpath.
      link:
        flags:
          - linux: ["-Wl,-soname,libmonstro.so"]
          - macos: ["-Wl,-install_name,@rpath/libmonstro.dylib"]
      deps: []
