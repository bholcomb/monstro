# Monstro Examples

artifacts:
  transform:
    - name: ui_shaders
      tool: glslangValidator
      inputs:
        - "common/shaders/*.vert"
        - "common/shaders/*.frag"
      outputs: "${output_dir}/shaders/${filename}.spv"

targets:
  executables:
    - name: monstro_basic
      language: cpp
      sources:
        - "basic/*.cpp"
      include_dirs:
        - "../include"
        - "common"
      deps:
        - glfw3
        - vulkease
        - vulkan
      libs:
        - monstro
      depends_on:
        targets: [monstro]
        artifacts: [ui_shaders]

    - name: monstro_console
      language: cpp
      sources:
        - "console/*.cpp"
      include_dirs:
        - "../include"
        - "common"
      deps:
        - glfw3
