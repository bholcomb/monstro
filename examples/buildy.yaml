staging:
  name: monstro_examples_dist
  destination: "../bin"
  use_symlinks: false

  contents:
    - folder: "."
      targets:
        - monstro_basic
        - monstro_console
        - monstro_toast
        - monstro_property
        - monstro_shortcut
        - monstro_plot
        - monstro_curve
        - monstro_timeline
        - monstro_node
        - monstro_interaction
        - monstro_cockpit
        - libmonstro

    - folder: data/shaders
      artifacts:
        - ui_shaders

    - folder: data/fonts
      files:
        - "fonts/DejaVuSans.ttf"
        - "fonts/DejaVuSansMono-bitmap.png"
        - "fonts/LICENSE-DejaVu.txt"

    - folder: data/themes/scifi
