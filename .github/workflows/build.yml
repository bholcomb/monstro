# Builds monstro's shared library on every platform games ship it for, runs the tests there and
# packages it with its headers: monstro-<version>-<rid>.tar.gz (.zip on Windows), as ci/build.py
# describes. The version is the tag's without its v on a tag (v0.1.0 -> 0.1.0), else the short
# commit. Pushes and pull requests build, test and package; a version tag (v*) also publishes a
# release holding the three archives and a SHA256SUMS file.
#
# Every platform builds with the buildy release pinned in ci/buildy.json.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc and libstdc++ are the oldest the Linux library then needs.
          - rid: linux-x64
            os: ubuntu-22.04
            python: python3
            buildy: build/buildy/buildy
          - rid: win-x64
            os: windows-2025
            python: python
            buildy: build/buildy/buildy.exe
          - rid: osx-arm64
            os: macos-15
            python: python3
            buildy: build/buildy/buildy
    env:
      # The oldest macOS on Apple silicon, so the library loads on every one.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Downloads the pinned release's archive for this platform and checks its SHA-256; fails
      # while the pin is a placeholder.
      - name: Get buildy
        run: ${{ matrix.python }} ci/fetch_buildy.py build/buildy

      # buildy calls cl.exe and link.exe: export the environment of
      # vcvars64.bat (the x64 MSVC tools) to the later steps.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the x64 C++ tools" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $vars = cmd /c "call `"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $vars) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # Git's bash puts its own link.exe (coreutils) ahead of MSVC's.
      - name: Use MSVC's link.exe (Windows)
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build, test and package
        run: |
          version="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          ${{ matrix.python }} ci/build.py --buildy ${{ matrix.buildy }} --version "$version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monstro-${{ matrix.rid }}
          path: build/ci/out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: monstro-*
          path: release
          merge-multiple: true
      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="monstro-$version-linux-x64.tar.gz monstro-$version-osx-arm64.tar.gz monstro-$version-win-x64.zip"
          found="$(ls | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$found" != "$expected" ]; then
            echo "Expected the files '$expected', found '$found'"
            exit 1
          fi
          sha256sum $expected > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "monstro's shared library and headers for each platform, built and tested at $GITHUB_SHA." \
            $expected SHA256SUMS
