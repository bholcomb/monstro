# Monstero - Vulkan made easy
# Root build configuration

project:
  name: monstero
  version: "2.0.0"
  description: "Monstero - A simple UI themable UI library"

variables:
  import_env_vars:
    # Only the examples use these; the library and tests build without them.
    # For the examples on Linux, source the Vulkan SDK's setup-env.sh first:
    # the distribution's loader is older than the Vulkan 1.4 VulkEase needs.
    - name: VULKAN_SDK
      default: ""
    # VulkEase checkout, built so its dist/ holds the library and headers
    - name: VULKEASE_ROOT
      default: "${workspace_root}/../vulkease"
    # Only required on Windows; Linux builds GLFW from source
    - name: GLFW_ROOT
      default: ""                   # Empty default for Linux (uses system paths)

  SO_VERSION: "2"
  
  # Platform-specific dotnet runtime paths
  platforms:
    linux:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/linux-x64/native"
    windows:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/win-x64/native"
    macos:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/osx-x64/native"

workspace:
  modules:
    - src
    - examples
    - tests

dependencies:
  file: buildy_config/dependencies.yaml

environment:
  toolchains:
    default: gcc-cpp-linux
    windows: msvc-cpp-windows
    macos: clang-cpp-macos
    
  compile:
    cpp_standard: "c++17"
    c_standard: "c11"
    warnings: extra
    # MSVC has its own spelling (/WX) and other warnings at /W4; there, warnings stay warnings.
    flags:
      - linux: ["-Werror"]
      - macos: ["-Werror"]
    
  configurations:
    debug:
      optimization: none
      symbols: true
      defines: ["DEBUG=1"]
    release:
      optimization: full
      defines: ["NDEBUG=1"]

staging:
  name: monstro_dist
  destination: "dist"
  use_symlinks: false

  contents:
    # Main library for distribution
    - folder: "bin"
      files:
        - linux:
            - "${out_dir}/bin/libmonstro.so"
        - windows:
            - "${out_dir}/bin/libmonstro.dll"
        - macos:
            - "${out_dir}/bin/libmonstro.dylib"

    - folder: "lib"
      files:
        - windows:
            - "${out_dir}/lib/libmonstro.lib"
    
    # Public headers for library users
    - folder: "include"
      files:
        - "include/monstro.h"
    - folder: "include/monstro"
      files:
        - "include/monstro/*.h"

    # docs
    - folder: "docs"
      files:
        - "README.md"