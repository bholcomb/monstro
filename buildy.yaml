# Monstero - Vulkan made easy
# Root build configuration

project:
  name: monstero
  version: "2.0.0"
  description: "Monstero - A simple UI themable UI library"

variables:
  import_env_vars:
    # These are only required on Windows; Linux uses system packages
    - name: GLFW_ROOT
      default: ""                   # Empty default for Linux (uses system paths)

  SO_VERSION: "2"
  
  # Platform-specific dotnet runtime paths
  platforms:
    linux:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/linux-x64/native"
    windows:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/win-x64/native"
    macos:
      DOTNET_RUNTIME_DIR: "dotnet/src/runtimes/osx-x64/native"

workspace:
  modules:
    - src
    - examples
    - tests

dependencies:
  file: buildy_config/dependencies.yaml

environment:
  toolchains:
    default: gcc-cpp-linux
    windows: msvc-cpp-windows
    macos: clang-cpp-macos
    
  compile:
    cpp_standard: "c++17"
    c_standard: "c11"
    warnings: extra
    flags: ["-Werror"]
    
  configurations:
    debug:
      optimization: none
      symbols: true
      defines: ["DEBUG=1"]
    release:
      optimization: full
      defines: ["NDEBUG=1"]

staging:
  name: monstro_dist
  destination: "dist"
  use_symlinks: false

  contents:
    # Main library for distribution
    - folder: "bin"
      files:
        - linux:
            - "${out_dir}/bin/libmonstro.so"
        - windows:
            - "${out_dir}/bin/monstro.dll"
        - macos:
            - "${out_dir}/bin/libmonstro.dylib"

    - folder: "lib"
      files:
        - windows:
            - "${out_dir}/lib/monstro.lib"
    
    # Public headers for library users
    - folder: "include"
      files:
        - "include/monstro.h"
    - folder: "include/monstro"
      files:
        - "include/monstro/*.h"

    # docs
    - folder: "docs"
      files:
        - "README.md"