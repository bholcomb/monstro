# VulkEase - Vulkan made easy
# Pre-built library from the dist directory of a VulkEase checkout at
# VULKEASE_ROOT (default: ../vulkease, next to this repository)

vulkease:
  common:
    include_dirs:
      - "${VULKEASE_ROOT}/dist/include"
    lib_dirs:
      - "${VULKEASE_ROOT}/dist/bin"
    libs:
      - "vulkease"
