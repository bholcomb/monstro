# Monstro headless tests (tests/run.sh also builds a sanitizer variant)

targets:
  executables:
    - name: monstro_tests
      language: cpp
      sources:
        - "*.cpp"
        - "../src/*.cpp"
        - "../src/widgets/*.cpp"
        - "../examples/console/console.cpp"
        - "../examples/curve/curve.cpp"
        - "../examples/node/node.cpp"
        - "../examples/plot/plot.cpp"
        - "../examples/property/property.cpp"
        - "../examples/shortcut/shortcut.cpp"
        - "../examples/timeline/timeline.cpp"
        - "../examples/toast/toast.cpp"
      include_dirs:
        - "../include"
        - "../externals"
        - "../src"
      deps: []
